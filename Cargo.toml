[package]
name = "gongwen-assistant"
version = "0.9.1"
edition = "2024"
description = "基于 egui 与本地 LM Studio 的离线公文写作助手"
license = "GPL-3.0-or-later"

[package.metadata.winresource]
ProductName = "公文助手"
FileDescription = "公文助手"
OriginalFilename = "gongwen-assistant.exe"

[features]
# Debian/麒麟等传统桌面继续使用不依赖 portal 的 GTK3 文件选择器；
# Arch/Omarchy 发布包用 `--no-default-features --features linux-portal-dialogs`
# 构建，以便文件选择器跟随 Hyprland/Wayland 桌面。
default = ["linux-gtk-dialogs"]
linux-gtk-dialogs = ["rfd/gtk3"]
linux-portal-dialogs = ["rfd/async-std", "rfd/xdg-portal"]

[dependencies]
aho-corasick = "1.1.5"
anydoc = "0.2.4"
anyhow = "1.0"
# 研究报告的 .bib 解析：起草页文献引用下拉、悬停卡与审校要作者、题名、年份与出错行号。
# 与 mdx、hayagriva 用的是同一份。
biblatex = "0.12"
calamine = "0.36.1"
chardetng = "1.0.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
docx-rs = "0.4.22"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35.0"
egui_dnd = "0.16.0"
egui_extras = { version = "0.35.0", features = ["image", "svg"] }
encoding_rs = "0.8.41"
# 文献著录预览：与 Typst 排 PDF 参考文献表同一个库、同一份 GB/T 7714 样式，
# 版本钉在 typst 所用的 0.10.1，不多编一份。
hayagriva = "0.10.1"
hayro = { version = "0.7.1", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jieba-rs = "0.11.0"
# 研究报告公式的预览渲染：纯 Rust 排版 + PNG 光栅化（STIX Two Math），不走 tectonic。
# 只开 png feature；它的 egui feature 钉在 egui 0.28，与本项目的 0.35 不兼容。
latex-rust = { path = "vendor/latex-rust", features = ["png"] }
# 送批材料合并导出：把逐件编译的 PDF 合成一个、补双面打印的空白页。
# 只用读写与对象操作，关掉默认的 rayon / chrono-clock。
lopdf = { version = "0.45.0", default-features = false }
# 随仓库分发的副本，见 vendor/mdx/README.md：构建不依赖 GitHub 可达，
# 离线也能从零编译。同步上游的办法写在那份 README 里。
mdx = { path = "vendor/mdx" }
merman = { version = "0.7.0", features = ["raster"] }
# 只为实现 merman 的 TextMeasurer：它的 TextStyle / TextMetrics 没有经 merman 重导出。
merman-render = "0.7.0"
nucleo-matcher = "0.3.1"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "system-proxy"] }
# Mermaid 的 SVG 由本进程自己转 PNG / PDF：随包字体只建一次字体库反复复用，
# 并把图按版心宽落到画布上。两者版本与 merman 内部所用的一致，不多引入副本。
resvg = "0.46"
# Linux 文件选择器后端由上面的 crate feature 选择。不能同时把两种后端写在这里，
# 因为 rfd 在启用 gtk3 时会固定选择 GTK3，而不会在运行时退回 portal。
rfd = { version = "0.15", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 技能文件（SKILL.md）的 YAML 开头。已经是 hayagriva 的依赖，不新增下载。
serde_yaml = "0.9"
sha2 = "0.11"
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }
svg2pdf = "0.13"
tempfile = "3.20"
ttf-parser = "0.25.1"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
uuid = { version = "1.24", features = ["v4"] }
zip = "4.3"

[target.'cfg(windows)'.dependencies]
# 应用内打印走原生 GDI：不依赖任何第三方 PDF 软件注册 print 谓词。
# 该 crate 已随 winit 在依赖树中，这里只是声明直接引用。
# DataExchange / Memory 用于把导出成品以 CF_HDROP 放进剪贴板（复制文件）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# winit 的窗口图标命令在 macOS 上无效；用 AppKit 同步更新 Dock 图标。
# NSPasteboard / NSURL 用于把导出成品放进剪贴板（复制文件）。
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSString", "NSURL", "NSUserDefaults"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

# PDF 光栅化（hayro / vello_cpu）是纯 CPU 逐像素合成，未优化的依赖会慢两个数量级：
# 实测同一页 A4 公文 debug 下 445ms、优化后 3.4ms。只给依赖开优化，自己的代码
# 仍然编译快、可调试。首次会多花一分钟重编依赖，之后不受影响。
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.35", default-features = false }
insta = "1.48.0"
proptest = "1.11.0"

# Typst 排版引擎打了一处公文补丁（两端对齐不压行内标点），见 vendor/typst-layout/README.md。
[patch.crates-io]
typst-layout = { path = "vendor/typst-layout" }
