[package]
name = "gongwen-assistant"
version = "0.3.18"
edition = "2024"
description = "基于 egui 与本地 LM Studio 的离线公文写作助手"
license = "MIT"

[package.metadata.winresource]
ProductName = "公文助手"
FileDescription = "公文助手"
OriginalFilename = "gongwen-assistant.exe"

[dependencies]
anydoc = "0.1.7"
anyhow = "1.0"
calamine = "0.30"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
docx-rs = "0.4.22"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jieba-rs = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Linux 上用 GTK3 后端（自带对话框），不依赖 xdg-desktop-portal / zenity，
# 麒麟等无 portal 文件服务的国产系统也能正常弹出文件选择框。
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.79"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ttf-parser = "0.25.1"
zip = "4.3"

[target.'cfg(target_os = "macos")'.dependencies]
# winit 的窗口图标命令在 macOS 上无效；用 AppKit 同步更新 Dock 图标。
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSData"] }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true
