name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            suffix: win-x64
            binary: gongwen-assistant.exe
            runtime_repo: billowsand/gongwen-runtime
            archive: zip
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            suffix: linux-arm64
            binary: gongwen-assistant
            runtime_repo: billowsand/gongwen-runtime
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_REPO: ${{ matrix.runtime_repo }}
          RUNTIME_SUFFIX: ${{ matrix.suffix }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime-$env:RUNTIME_SUFFIX.zip"
          gh release download "$env:GITHUB_REF_NAME" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Package full release
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary }}
          SUFFIX: ${{ matrix.suffix }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $suffix = $env:SUFFIX
          $ext = if ($env:ARCHIVE_FORMAT -eq "tar.gz") { "tar.gz" } else { "zip" }
          $asset = "gongwen-assistant-$version-$suffix-full.$ext"
          $staging = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, "dist", "${suffix}-full")
          ./scripts/package-portable.ps1 -Suffix $suffix -BinaryName $env:BINARY_NAME -OutputDir $staging -ArchiveFormat $env:ARCHIVE_FORMAT -ArchivePath (Join-Path $env:GITHUB_WORKSPACE $asset) -SkipBuild -Force
          Get-FileHash -Algorithm SHA256 $asset | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $asset"
          } | Set-Content "${asset}.sha256" -Encoding utf8

      - name: Smoke test packaged TeX runtime
        shell: pwsh
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          $suffix = $env:SUFFIX
          $staging = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, "dist", "${suffix}-full")
          $env:GONGWEN_RUNTIME_DIR = [System.IO.Path]::Combine($staging, "runtime")
          cargo test --release --bin gongwen-assistant "texcompile::tests::compiles_" -- --ignored

      - name: Package release zip
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $staging = Join-Path $env:RUNNER_TEMP 'staging'
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/release/$($env:BINARY_NAME)" $staging
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE, config.example.json $staging
          Copy-Item -LiteralPath "font/licenses" -Destination (Join-Path $staging "licenses/fonts") -Recurse
          $asset = "gongwen-assistant-$version-$($env:SUFFIX).zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $asset
          Get-FileHash -Algorithm SHA256 $asset | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $asset"
          } | Set-Content "$asset.sha256" -Encoding utf8
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            gongwen-assistant-*.zip*
            gongwen-assistant-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
