name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 当前发布口径（用户 2026-11-10 指定）：只发布 Windows x64 安装程序。
# Linux ARM64 deb、Linux x86_64 Arch 包与 macOS dmg 的构建作业保留但停用，
# 需要恢复时去掉对应作业的 `if: false` 并把它们加回 release 的 needs 与资产校验。
#
# Runtime assets are versioned independently of the app; bump this tag only
# when the runtime contents actually change. The tagged release must provide
# runtime.zip (platform-neutral; Windows installer and Linux deb both pull
# the same archive).
env:
  # v0.8.0 起中文字体统一为方正 GBK 系列（仿宋/楷体/黑体/书宋/小标宋），中易五支
  # 与小标宋简体不再随包。v0.8.1 起仿宋、楷体换成合成字体 GWFangSong / GWKai：
  # 汉字取方正 GBK，非汉字取仿宋_GB2312 / 楷体_GB2312。v0.8.2 起这两支换用重新
  # 合成的一版（字形更新、带 hinting 与内嵌位图，全角标点改取 GB2312 字形），
  # 文件名与家族名不变。页码数字另用宋体字面的拉丁子集
  # GWSimSunLatin（scripts/make-latin-subsets.py 生成）。
  # 研究报告另需 TeX Gyre Termes 与 JetBrains Mono。研究报告按文件名从 runtime
  # 加载字体，用户机器不必安装。
  # PDF 由 Typst 在进程内排版：runtime 包里旧有的 tectonic/、texbundle/ 不再随包
  # 分发（package-portable.ps1 按清单复制时跳过），只用其中的字体与许可证。
  RUNTIME_RELEASE_TAG: v0.8.2
  RUNTIME_REPO: billowsand/gongwen-runtime

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Build both release binaries
        run: python scripts/build-editions.py

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Stage bundled Pi runtime
        shell: pwsh
        run: ./scripts/stage-pi-runtime.ps1 -Platform win-x64 -Force

      - name: Offline Pi runtime acceptance
        shell: pwsh
        run: ./runtime/pi/node.exe scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full"
          ./scripts/package-portable.ps1 -Suffix win-x64 -BinaryPath dist/editions/gongwen-assistant.exe -OutputDir $staging -ArchiveFormat none -Force
          ./scripts/package-portable.ps1 -Edition no-ai -Suffix win-x64 -BinaryPath dist/editions/gongwen-assistant-no-ai.exe -OutputDir dist/win-x64-full-no-ai -ArchiveFormat none -Force

      - name: Smoke test packaged runtime（PDF 排版）
        shell: pwsh
        run: |
          $env:GONGWEN_RUNTIME_DIR = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full/runtime"
          cargo test --locked --release --bin gongwen-assistant "shipped_runtime_typesets_every_kind" -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GONGWEN_RUNTIME_DIR = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full-no-ai/runtime"
          cargo test --locked --release --no-default-features --features task-assistant,linux-gtk-dialogs --bin gongwen-assistant "shipped_runtime_typesets_every_kind" -- --ignored

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress --accept-license

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full"
          ./scripts/package-installer.ps1 -Version $version -SourceDir $staging -OutputDir $env:GITHUB_WORKSPACE -Force
          ./scripts/package-installer.ps1 -Edition no-ai -Version $version -SourceDir dist/win-x64-full-no-ai -OutputDir $env:GITHUB_WORKSPACE -Force
          foreach ($asset in @("gongwen-assistant-$version-win-x64-setup.exe", "gongwen-assistant-no-ai-$version-win-x64-setup.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText(
              "${asset}.sha256",
              "$hash  $asset`n",
              [System.Text.UTF8Encoding]::new($false))
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: |
            gongwen-assistant-*-win-x64-setup.exe*
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64
    # 本次发布只出 Windows：作业保留，恢复时删掉这一行。
    if: false
    runs-on: macos-15
    timeout-minutes: 90
    # 签名 / 公证都可选：secrets 未配置时为空，package-dmg.sh 走 ad-hoc 签名——那种
    # 包只能本机测试，Gatekeeper 会在别的机器上拦。证书导入步骤未内置（runner 是
    # 临时机器，需要先从 secrets 导入 .p12 到临时 keychain），见 packaging/macos/README.md。
    env:
      GONGWEN_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      GONGWEN_MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Download runtime assets
        run: |
          set -euo pipefail
          asset=runtime.zip
          curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/${asset}" \
            --output "/tmp/${asset}"
          unzip -qo "/tmp/${asset}" -d runtime || {
            status=$?
            # Windows Compress-Archive 存的反斜杠，Info-ZIP 会警告但仍能解开。
            test "$status" -eq 1
          }
          test -f runtime/fonts/GWFangSong.ttf
          test -f runtime/SHA256SUMS.txt

      - name: Stage bundled Pi runtime
        run: bash ./scripts/stage-pi-runtime.sh --platform darwin-arm64 --force

      - name: Offline Pi runtime acceptance
        run: ./runtime/pi/bin/node scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Build both release binaries
        run: python3 scripts/build-editions.py

      - name: Package DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash ./scripts/package-dmg.sh --version "$version" --binary dist/editions/gongwen-assistant --require-pi \
            --output "$GITHUB_WORKSPACE/dist/macos"
          bash ./scripts/package-dmg.sh --version "$version" --edition no-ai --binary dist/editions/gongwen-assistant-no-ai \
            --output "$GITHUB_WORKSPACE/dist/macos"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            dist/macos/*.dmg
            dist/macos/*.dmg.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 / GLIBC 2.28
    # 本次发布只出 Windows：作业保留，恢复时删掉这一行。
    if: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:buster
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            unzip \
            build-essential \
            pkg-config \
            file \
            binutils \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Debian ARM64 build baseline
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      - name: Build release binary
        run: |
          set -euo pipefail
          # Debian/麒麟包使用 GTK3 文件选择器（默认 feature）。
          cargo build --release --locked
          mkdir -p dist/editions
          cp target/release/gongwen-assistant dist/editions/gongwen-assistant
          cargo build --release --locked --no-default-features --features task-assistant,linux-gtk-dialogs
          cp target/release/gongwen-assistant dist/editions/gongwen-assistant-no-ai

      - name: Verify ARM64 and GLIBC compatibility
        run: |
          set -euo pipefail
          for binary in dist/editions/gongwen-assistant*; do
            file "$binary"
            readelf -h "$binary"
            ldd "$binary"
            ! ldd "$binary" | grep -F 'not found'

            machine="$(
              readelf -h "$binary" \
                | awk -F: '/Machine:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }'
            )"
            echo "ELF machine: [$machine]"
            case "$machine" in
              *AArch64*) ;;
              *) echo "Expected AArch64, got: $machine" >&2; exit 1 ;;
            esac

            max_glibc="$(
              readelf --version-info "$binary" \
                | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
                | sort -Vu \
                | tail -1 \
                || true
            )"
            echo "Maximum required GLIBC version: $max_glibc"
            test -n "$max_glibc"
            dpkg --compare-versions "${max_glibc#GLIBC_}" le "2.28"
          done

      - name: Download runtime assets for smoke test
        run: |
          set -euo pipefail
          asset=runtime.zip
          curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/${asset}" \
            --output "/tmp/${asset}"
          unzip -qo "/tmp/${asset}" -d runtime || {
            status=$?
            # Windows Compress-Archive stores backslash separators. Info-ZIP
            # extracts them correctly but reports warning status 1 on Linux.
            test "$status" -eq 1
          }
          # 公文与研究报告共用方正 GBK 系列：拿到旧 runtime（中易五支）时在这里
          # 就失败，而不是等用户点了导出才报「字体不存在」。
          test -f runtime/fonts/GWFangSong.ttf
          test -f runtime/fonts/FZShuSong.ttf
          test -f runtime/SHA256SUMS.txt

      - name: Smoke test packaged runtime（PDF 排版）
        run: |
          set -euo pipefail
          export GONGWEN_RUNTIME_DIR="$GITHUB_WORKSPACE/runtime"
          cargo test --locked --release --bin gongwen-assistant "shipped_runtime_typesets_every_kind" -- --ignored

      - name: Upload GLIBC 2.28 binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-glibc228-binary
          path: dist/editions/gongwen-assistant*
          if-no-files-found: error

  package-linux-arm64:
    name: Package Linux ARM64
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Download GLIBC 2.28 binary
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-glibc228-binary
          path: target/release

      - name: Make binary executable
        shell: bash
        run: chmod +x target/release/gongwen-assistant target/release/gongwen-assistant-no-ai

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Stage bundled Pi runtime
        shell: bash
        run: bash ./scripts/stage-pi-runtime.sh --platform linux-arm64 --force

      - name: Offline Pi runtime acceptance
        shell: bash
        run: ./runtime/pi/bin/node scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/linux-arm64-full"
          ./scripts/package-portable.ps1 -Suffix linux-arm64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force
          ./scripts/package-portable.ps1 -Edition no-ai -Suffix linux-arm64 -BinaryPath target/release/gongwen-assistant-no-ai -OutputDir dist/linux-arm64-full-no-ai -ArchiveFormat none -Force

      - name: Package Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/linux-arm64-full"
          bash ./scripts/package-deb.sh "$version" "$staging" "$GITHUB_WORKSPACE"
          bash ./scripts/package-deb.sh "$version" dist/linux-arm64-full-no-ai "$GITHUB_WORKSPACE" arm64 no-ai
          for prefix in gongwen-assistant gongwen-assistant-no-ai; do
            asset="${prefix}_${version}_arm64.deb"
            sha256sum "$asset" | awk '{ printf "%s  %s\n", $1, $2 }' > "${asset}.sha256"
          done

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: |
            gongwen-assistant_*_arm64.deb*
            gongwen-assistant-no-ai_*_arm64.deb*
          if-no-files-found: error

  # Omarchy / Arch 用户要的是能离线 `pacman -U` 的包。在 Arch 容器里编译并用
  # makepkg 打成 .pkg.tar.zst：二进制链接的是 Arch 自己的 glibc 与图形库，
  # 依赖名从 pacman 数据库反查（写错一个包名，用户机器上 pacman -U 会直接拒装）。
  build-linux-x86_64-arch:
    name: Build Linux AMD64 / Arch (Omarchy)
    # 本次发布只出 Windows：作业保留，恢复时删掉这一行。
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build dependencies
        run: |
          set -euo pipefail
          pacman -Syyu --noconfirm --needed --overwrite '*' \
            base-devel cmake git curl unzip zip pkgconf fakeroot file zstd \
            libx11 libxcursor libxrandr libxi libxinerama \
            libxkbcommon libxkbcommon-x11 libglvnd wayland \
            fontconfig dbus zlib jq iproute2

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Build release binary
        run: |
          set -euo pipefail
          # Arch/Omarchy 变体：原生 Wayland + XDG Desktop Portal 文件选择框，
          # 不依赖 GTK3（GTK3 那套留给 Debian / 麒麟）。
          cargo build --release --locked --no-default-features --features ai,linux-portal-dialogs
          mkdir -p dist/editions
          cp target/release/gongwen-assistant dist/editions/gongwen-assistant
          cargo build --release --locked --no-default-features --features task-assistant,linux-portal-dialogs
          cp target/release/gongwen-assistant dist/editions/gongwen-assistant-no-ai

      - name: Download runtime assets
        run: |
          set -euo pipefail
          curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/runtime.zip" \
            --output /tmp/runtime.zip
          unzip -qo /tmp/runtime.zip -d runtime || {
            status=$?
            # Windows Compress-Archive 存的反斜杠，Info-ZIP 会警告但仍能解开。
            test "$status" -eq 1
          }
          test -f runtime/fonts/GWFangSong.ttf
          test -f runtime/SHA256SUMS.txt

      - name: Stage bundled Pi runtime
        run: |
          set -euo pipefail
          bash ./scripts/stage-pi-runtime.sh --platform linux-x64 --force

      - name: Offline Pi runtime acceptance
        run: |
          set -euo pipefail
          ./runtime/pi/bin/node scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Assemble staging directory
        run: |
          set -euo pipefail
          bash ./scripts/stage-linux-portable.sh \
            dist/editions/gongwen-assistant runtime dist/staging-linux-x86_64
          bash ./scripts/stage-linux-portable.sh \
            dist/editions/gongwen-assistant-no-ai runtime dist/staging-linux-x86_64-no-ai no-ai

      - name: Build pacman package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash ./scripts/package-arch-pkg.sh \
            "$version" dist/staging-linux-x86_64 dist amd64
          bash ./scripts/package-arch-pkg.sh \
            "$version" dist/staging-linux-x86_64-no-ai dist amd64 no-ai

      - name: Upload Arch release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64-arch
          path: |
            dist/gongwen-assistant-*-x86_64.pkg.tar.zst*
          if-no-files-found: error

  # 在干净的 Arch 容器里真装一次 pacman 包：依赖名写错、文件没落到位、属主不是
  # root、动态库缺失，都在这里暴露，而不是等用户在离线机器上 pacman -U 才发现。
  verify-arch-pkg:
    name: Verify pacman install (Arch / x86_64)
    needs: build-linux-x86_64-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v7

      - name: Download Arch release assets
        uses: actions/download-artifact@v8
        with:
          name: release-linux-x86_64-arch
          path: dist

      - name: Install package and check
        run: |
          set -euo pipefail
          bash ./scripts/verify-arch-pkg-install.sh dist/gongwen-assistant-[0-9]*-x86_64.pkg.tar.zst
          bash ./scripts/verify-arch-pkg-install.sh dist/gongwen-assistant-no-ai-*-x86_64.pkg.tar.zst

      # 装得上不等于打得开：dlopen 的库、GL 上下文、首帧 panic 只有真起窗口
      # 才暴露。见 scripts/smoke-launch-linux.sh。
      - name: Install virtual display
        run: |
          set -euo pipefail
          # Arch 上的包名：Xvfb 在 xorg-server-xvfb，xwininfo 在 xorg-xwininfo，
          # xwd 在 xorg-xwd。
          pacman -S --noconfirm --needed \
            xorg-server-xvfb xorg-xwininfo xorg-xwd imagemagick mesa

      - name: Launch app under Xvfb
        run: |
          set -euo pipefail
          # Arch 的 Xvfb + Mesa 未必给得出合法 GLX context；带 GLX 的场景没过时
          # 退回只跑 EGL 那条路（软件照样要能开窗、不闪退）。
          bash ./scripts/smoke-launch-linux.sh gongwen-assistant 20 launch-smoke \
            || {
              echo "::warning::带 GLX 的场景没过，改跑无 GLX 场景"
              SMOKE_SKIP_GLX=1 bash ./scripts/smoke-launch-linux.sh gongwen-assistant 20 launch-smoke-noglx
            }

      - name: Upload launch logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-arch-x86_64
          path: launch-smoke
          if-no-files-found: ignore
          retention-days: 14

  # 在干净的 Ubuntu 20.04（麒麟 V10 的底子，也是发布包的目标系统）里真装一次
  # deb：包名写错（如 libgdk-pixbuf-2.0-0 在 20.04 上叫 libgdk-pixbuf2.0-0）
  # 会在这里失败，而不是等用户在离线机器上 dpkg -i 才发现。
  verify-deb:
    name: Verify deb install / arm64 / ubuntu:20.04
    needs: package-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: release-linux-arm64
          path: dist

      - name: Install deb and check shared libraries
        run: |
          set -euo pipefail
          bash ./scripts/verify-deb-install.sh dist/gongwen-assistant_*_arm64.deb
          bash ./scripts/verify-deb-install.sh dist/gongwen-assistant-no-ai_*_arm64.deb

      # 装得上不等于打得开：dlopen 的库、GL 上下文、首帧 panic 只有真起窗口
      # 才暴露。见 scripts/smoke-launch-linux.sh。
      - name: Launch app under Xvfb
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            xvfb x11-utils x11-apps imagemagick
          bash ./scripts/smoke-launch-linux.sh gongwen-assistant 20 launch-smoke

      - name: Upload launch logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-arm64-ubuntu2004
          path: launch-smoke
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [build-windows]
    # 当前只发布 Windows x64 安装程序；其他平台作业停用后不再参与 needs。
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          version="${GITHUB_REF_NAME#v}"
          for prefix in gongwen-assistant gongwen-assistant-no-ai; do
            asset="$prefix-$version-win-x64-setup.exe"
            test -f "$asset"
            sha256sum --check "$asset.sha256"
          done
          # 版本更新说明随源码一起提交，发布时直接取用。
          # --generate-notes 产出的正文只有一行 changelog 链接，等于什么都没写，
          # 只在缺说明文件时兜底，并且会在工作流里留一条告警。
          notes="$GITHUB_WORKSPACE/docs/release-notes/${GITHUB_REF_NAME}.md"
          title="公文助手 ${GITHUB_REF_NAME}"
          if [ -f "$notes" ]; then
            create_args=(--title "$title" --notes-file "$notes")
          else
            echo "::warning::缺少 docs/release-notes/${GITHUB_REF_NAME}.md，本次回退到自动生成的说明"
            create_args=(--title "$title" --generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
            # 重跑时把标题和说明一并刷新，免得留着上一次的占位正文。
            # --draft=false 不能省：删掉 tag 重打同一个版本号时，GitHub 会把上一
            # 个 release 转成未挂 tag 的草稿，不改回来它就既不正式、也点不开下载。
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "$title" --notes-file "$notes" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" "${create_args[@]}"
          fi
