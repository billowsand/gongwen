name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Runtime assets are versioned independently of the app; bump this tag only
# when the runtime contents actually change. The tagged release must provide
# runtime-win-x64.zip, runtime-linux-arm64.zip, runtime-linux-amd64.zip and
# runtime-darwin-arm64.zip.
env:
  RUNTIME_RELEASE_TAG: v0.3.6
  RUNTIME_REPO: billowsand/gongwen-runtime

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime-win-x64.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full"
          ./scripts/package-portable.ps1 -Suffix win-x64 -BinaryName gongwen-assistant.exe -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Smoke test packaged TeX runtime
        shell: pwsh
        run: |
          $env:GONGWEN_RUNTIME_DIR = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full/runtime"
          cargo test --locked --release --bin gongwen-assistant "texcompile::tests::compiles_" -- --ignored

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress --accept-license

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/win-x64-full"
          ./scripts/package-installer.ps1 -Version $version -SourceDir $staging -OutputDir $env:GITHUB_WORKSPACE -Force
          $asset = "gongwen-assistant-$version-win-x64-setup.exe"
          Get-FileHash -Algorithm SHA256 $asset | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $asset"
          } | Set-Content "${asset}.sha256" -Encoding utf8

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: |
            gongwen-assistant-*-win-x64-setup.exe*
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 / GLIBC 2.28
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:buster
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            unzip \
            build-essential \
            pkg-config \
            file \
            binutils \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Debian ARM64 build baseline
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      - name: Build release binary
        run: |
          set -euo pipefail
          # Debian/麒麟包保留 GTK3 文件选择器。
          cargo build --release --locked
          cp target/release/gongwen-assistant target/release/gongwen-assistant-gtk

          # Arch/Omarchy 包使用桌面 portal，并以独立文件名上传给打包任务。
          cargo build --release --locked \
            --no-default-features --features linux-portal-dialogs
          mv target/release/gongwen-assistant target/release/gongwen-assistant-portal
          mv target/release/gongwen-assistant-gtk target/release/gongwen-assistant

      - name: Verify ARM64 and GLIBC compatibility
        run: |
          set -euo pipefail
          binary=target/release/gongwen-assistant
          file "$binary"
          readelf -h "$binary"
          ldd "$binary"
          ! ldd "$binary" | grep -F 'not found'

          machine="$(
            readelf -h "$binary" \
              | awk -F: '/Machine:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }'
          )"
          echo "ELF machine: [$machine]"
          case "$machine" in
            *AArch64*) ;;
            *) echo "Expected AArch64, got: $machine" >&2; exit 1 ;;
          esac

          max_glibc="$(
            readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sort -Vu \
              | tail -1 \
              || true
          )"
          echo "Maximum required GLIBC version: $max_glibc"
          test -n "$max_glibc"
          dpkg --compare-versions "${max_glibc#GLIBC_}" le "2.28"

      - name: Download runtime assets for smoke test
        run: |
          set -euo pipefail
          asset=runtime-linux-arm64.zip
          curl --fail --location --retry 3 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/${asset}" \
            --output "/tmp/${asset}"
          unzip -qo "/tmp/${asset}" -d runtime || {
            status=$?
            # Windows Compress-Archive stores backslash separators. Info-ZIP
            # extracts them correctly but reports warning status 1 on Linux.
            test "$status" -eq 1
          }
          test -f runtime/tectonic/linux-arm64/tectonic
          test -f runtime/texbundle/gongwen-texlive.ttb
          test -f runtime/fonts/FangSong.ttf
          test -f runtime/SHA256SUMS.linux-arm64.txt
          install -m 755 \
            runtime/tectonic/linux-arm64/tectonic \
            runtime/tectonic/tectonic

      - name: Smoke test packaged TeX runtime
        run: |
          set -euo pipefail
          export GONGWEN_RUNTIME_DIR="$GITHUB_WORKSPACE/runtime"
          cargo test --locked --release --bin gongwen-assistant "texcompile::tests::compiles_" -- --ignored

      - name: Upload GLIBC 2.28 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-glibc228-binary
          path: |
            target/release/gongwen-assistant
            target/release/gongwen-assistant-portal
          if-no-files-found: error

  package-linux-arm64:
    name: Package Linux ARM64
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Download GLIBC 2.28 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-glibc228-binary
          path: target/release

      - name: Make binary executable
        shell: bash
        run: chmod +x target/release/gongwen-assistant

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime-linux-arm64.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/linux-arm64-full"
          ./scripts/package-portable.ps1 -Suffix linux-arm64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Package Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/linux-arm64-full"
          bash ./scripts/package-deb.sh "$version" "$staging" "$GITHUB_WORKSPACE"
          asset="gongwen-assistant_${version}_arm64.deb"
          sha256sum "$asset" | awk '{ printf "%s  %s\n", $1, $2 }' > "${asset}.sha256"

      - name: Prepare Omarchy portable directory
        shell: pwsh
        run: |
          Copy-Item -LiteralPath target/release/gongwen-assistant-portal -Destination target/release/gongwen-assistant -Force
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/linux-arm64-omarchy"
          ./scripts/package-portable.ps1 -Suffix linux-arm64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Package Omarchy archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/linux-arm64-omarchy"
          bash ./scripts/package-linux-tar.sh "$version" "$staging" "$GITHUB_WORKSPACE" arm64

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            gongwen-assistant_*_arm64.deb*
            gongwen-assistant-*-linux-arm64-omarchy.tar.gz*
          if-no-files-found: error

  build-linux-amd64:
    name: Build Linux AMD64 / GLIBC 2.28
    runs-on: ubuntu-latest
    container:
      image: debian:buster
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            unzip \
            build-essential \
            pkg-config \
            file \
            binutils \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Debian AMD64 build baseline
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --release --locked
          cp target/release/gongwen-assistant target/release/gongwen-assistant-gtk
          cargo build --release --locked \
            --no-default-features --features linux-portal-dialogs
          mv target/release/gongwen-assistant target/release/gongwen-assistant-portal
          mv target/release/gongwen-assistant-gtk target/release/gongwen-assistant

      - name: Verify AMD64 and GLIBC compatibility
        run: |
          set -euo pipefail
          binary=target/release/gongwen-assistant
          file "$binary"
          readelf -h "$binary"
          ldd "$binary"
          ! ldd "$binary" | grep -F 'not found'

          machine="$(
            readelf -h "$binary" \
              | awk -F: '/Machine:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }'
          )"
          echo "ELF machine: [$machine]"
          case "$machine" in
            *X86-64*) ;;
            *) echo "Expected X86-64, got: $machine" >&2; exit 1 ;;
          esac

          max_glibc="$(
            readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sort -Vu \
              | tail -1 \
              || true
          )"
          echo "Maximum required GLIBC version: $max_glibc"
          test -n "$max_glibc"
          dpkg --compare-versions "${max_glibc#GLIBC_}" le "2.28"

      - name: Download runtime assets for smoke test
        run: |
          set -euo pipefail
          asset=runtime-linux-amd64.zip
          curl --fail --location --retry 3 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/${asset}" \
            --output "/tmp/${asset}"
          unzip -qo "/tmp/${asset}" -d runtime || {
            status=$?
            test "$status" -eq 1
          }
          test -f runtime/tectonic/linux-amd64/tectonic
          test -f runtime/texbundle/gongwen-texlive.ttb
          test -f runtime/fonts/FangSong.ttf
          test -f runtime/SHA256SUMS.linux-amd64.txt
          install -m 755 \
            runtime/tectonic/linux-amd64/tectonic \
            runtime/tectonic/tectonic

      - name: Smoke test packaged TeX runtime
        run: |
          set -euo pipefail
          export GONGWEN_RUNTIME_DIR="$GITHUB_WORKSPACE/runtime"
          cargo test --locked --release --bin gongwen-assistant "texcompile::tests::compiles_" -- --ignored

      - name: Upload GLIBC 2.28 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-glibc228-binary
          path: |
            target/release/gongwen-assistant
            target/release/gongwen-assistant-portal
          if-no-files-found: error

  package-linux-amd64:
    name: Package Linux AMD64
    needs: build-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download GLIBC 2.28 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-glibc228-binary
          path: target/release

      - name: Make binary executable
        shell: bash
        run: chmod +x target/release/gongwen-assistant

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime-linux-amd64.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/linux-amd64-full"
          ./scripts/package-portable.ps1 -Suffix linux-amd64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Package Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/linux-amd64-full"
          bash ./scripts/package-deb.sh "$version" "$staging" "$GITHUB_WORKSPACE" amd64
          asset="gongwen-assistant_${version}_amd64.deb"
          sha256sum "$asset" | awk '{ printf "%s  %s\n", $1, $2 }' > "${asset}.sha256"

      - name: Prepare Omarchy portable directory
        shell: pwsh
        run: |
          Copy-Item -LiteralPath target/release/gongwen-assistant-portal -Destination target/release/gongwen-assistant -Force
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/linux-amd64-omarchy"
          ./scripts/package-portable.ps1 -Suffix linux-amd64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Package Omarchy archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/linux-amd64-omarchy"
          bash ./scripts/package-linux-tar.sh "$version" "$staging" "$GITHUB_WORKSPACE" amd64

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            gongwen-assistant_*_amd64.deb*
            gongwen-assistant-*-linux-amd64-omarchy.tar.gz*
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build release binary
        run: cargo build --release --locked

      - name: Download runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $asset = "runtime-darwin-arm64.zip"
          gh release download "$env:RUNTIME_RELEASE_TAG" --repo "$env:RUNTIME_REPO" --pattern $asset --dir runtime --clobber
          Expand-Archive -Path (Join-Path "runtime" $asset) -DestinationPath runtime -Force
          Remove-Item -LiteralPath (Join-Path "runtime" $asset) -Force

      - name: Prepare full staging directory
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "dist/macos-arm64-full"
          ./scripts/package-portable.ps1 -Suffix darwin-arm64 -BinaryName gongwen-assistant -OutputDir $staging -ArchiveFormat none -SkipBuild -Force

      - name: Smoke test packaged TeX runtime
        shell: pwsh
        run: |
          $env:GONGWEN_RUNTIME_DIR = Join-Path $env:GITHUB_WORKSPACE "dist/macos-arm64-full/runtime"
          cargo test --locked --release --bin gongwen-assistant "texcompile::tests::compiles_" -- --ignored

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$GITHUB_WORKSPACE/dist/macos-arm64-full"
          bash ./scripts/package-dmg.sh "$version" "$staging" "$GITHUB_WORKSPACE"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            gongwen-assistant-*-macos-arm64.dmg*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-windows, package-linux-arm64, package-linux-amd64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate Arch PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          amd64="release-assets/gongwen-assistant-${version}-linux-amd64-omarchy.tar.gz"
          arm64="release-assets/gongwen-assistant-${version}-linux-arm64-omarchy.tar.gz"
          amd64_sha="$(sha256sum "$amd64" | cut -d ' ' -f 1)"
          arm64_sha="$(sha256sum "$arm64" | cut -d ' ' -f 1)"
          sed \
            -e "s/@VERSION@/${version}/g" \
            -e "s/@AMD64_SHA256@/${amd64_sha}/g" \
            -e "s/@ARM64_SHA256@/${arm64_sha}/g" \
            packaging/arch/PKGBUILD.template \
            > release-assets/PKGBUILD
          sha256sum release-assets/PKGBUILD \
            | awk '{ printf "%s  PKGBUILD\n", $1 }' \
            > release-assets/PKGBUILD.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
