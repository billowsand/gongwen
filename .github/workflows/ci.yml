name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一次：RustSec 数据库是持续更新的，依赖不变也可能有新披露。
    - cron: "17 5 * * 1"

permissions:
  contents: read

# 当前只跑 Windows x64 门禁（与 release.yml 只发 Windows 一致），另保留依赖漏洞扫描。
# macOS、Linux（GLIBC 2.28）与 Ubuntu 20.04 启动冒烟四个作业保留在文件里但停用：
# 需要恢复时去掉对应作业的 `if: false`，并确认它们依赖的 `needs` 也一起恢复。

# 与 release.yml 保持一致：测试作业也要取同一份随包字体，预览 / 稿纸几何断言
# 依赖真实中文字体度量，缺字体时各平台会落到不同系统字体上而误报。
env:
  RUNTIME_RELEASE_TAG: v0.8.2
  RUNTIME_REPO: billowsand/gongwen-runtime

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: fmt / clippy / test (Windows x64)
    runs-on: windows-latest
    # 双版需要两轮 Clippy、两轮测试与两轮构建；冷缓存已超过旧 60 分钟上限。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint without AI
        run: cargo clippy --locked --no-default-features --features task-assistant,linux-gtk-dialogs --all-targets -- -D warnings

      - name: Download bundled fonts for layout tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          # gh 需要显式凭据；公开 release 资产直接走 curl，和 Linux / macOS 作业一致。
          curl.exe --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 `
            "https://github.com/$env:RUNTIME_REPO/releases/download/$env:RUNTIME_RELEASE_TAG/runtime.zip" `
            --output runtime/runtime.zip
          Expand-Archive -Path runtime/runtime.zip -DestinationPath runtime -Force
          Remove-Item runtime/runtime.zip

      # 串行跑测试：vault 的 DEK 句柄与配置目录是进程级状态，Pi 运行记录、加密资源
      # 与单实例等用例并行时会互相污染（Windows / macOS runner 上出现过「尚未解锁」
      # 与 Broken pipe 的伪失败）。整套用例本地串行约 1 分钟，换确定性更值得。
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Test without AI
        run: cargo test --locked --no-default-features --features task-assistant,linux-gtk-dialogs --all-targets -- --test-threads=1

      - name: Build both editions
        run: python scripts/build-editions.py

      - name: Upload both executables
        uses: actions/upload-artifact@v7
        with:
          name: ci-win-x64-editions
          path: dist/editions/*.exe
          if-no-files-found: error

      - name: Stage bundled Pi runtime
        shell: pwsh
        run: ./scripts/stage-pi-runtime.ps1 -Platform win-x64 -Force

      - name: Pi host tests (bundled Node)
        shell: pwsh
        working-directory: pi-host
        run: |
          # 测试源码仍在 pi-host/，依赖使用已组装的真实生产树；目标运行时不放测试文件。
          Copy-Item ../runtime/pi/host/node_modules ./node_modules -Recurse
          ../runtime/pi/node.exe --test

      - name: Pi writing evaluation judge regression (offline)
        shell: pwsh
        run: |
          ./runtime/pi/node.exe --test scripts/pi-writing-eval.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./runtime/pi/node.exe scripts/pi-writing-eval.mjs --selftest

      - name: Offline Pi runtime acceptance
        shell: pwsh
        run: ./runtime/pi/node.exe scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Pi runtime manifest end-to-end
        shell: pwsh
        run: cargo test --locked shipped_pi_runtime_manifest -- --ignored

  macos-arm64:
    name: fmt / clippy / test (macOS arm64)
    # 停用：当前只做 Windows x64。恢复时删掉这一行。
    if: false
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Stage bundled Pi runtime
        run: bash ./scripts/stage-pi-runtime.sh --platform darwin-arm64 --force

      - name: Put bundled Node on PATH
        run: echo "$PWD/runtime/pi/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Download bundled fonts for layout tests
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/runtime.zip" \
            -o /tmp/runtime.zip
          unzip -qo /tmp/runtime.zip -d runtime

      # 串行跑测试：vault 的 DEK 句柄与配置目录是进程级状态，Pi 运行记录、加密资源
      # 与单实例等用例并行时会互相污染（Windows / macOS runner 上出现过「尚未解锁」
      # 与 Broken pipe 的伪失败）。整套用例本地串行约 1 分钟，换确定性更值得。
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Pi runtime manifest end-to-end
        run: cargo test --locked shipped_pi_runtime_manifest -- --ignored

      - name: Pi host tests (bundled Node)
        working-directory: pi-host
        run: |
          # 测试源码仍在 pi-host/，依赖使用已组装的真实生产树；目标运行时不放测试文件。
          rm -rf node_modules
          cp -R ../runtime/pi/host/node_modules ./node_modules
          ../runtime/pi/bin/node --test

      - name: Offline Pi runtime acceptance
        run: ./runtime/pi/bin/node scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Pi writing evaluation judge regression (offline)
        run: |
          ./runtime/pi/bin/node --test scripts/pi-writing-eval.test.mjs
          ./runtime/pi/bin/node scripts/pi-writing-eval.mjs --selftest

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble macOS app bundle
        run: bash ./scripts/package-macos.sh --skip-build --output dist/macos

      - name: Zip app bundle
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/macos/GongwenAssistant.app \
            dist/gongwen-assistant-macos-arm64.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-macos-arm64-app
          path: dist/gongwen-assistant-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  linux-arm64-glibc228:
    name: fmt / clippy / test (Linux ARM64 / GLIBC 2.28)
    # 停用：当前只做 Windows x64。恢复时删掉这一行。
    if: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: debian:buster
    defaults:
      run:
        shell: bash
    steps:
      # The minimal Debian image has no Git, so install build prerequisites
      # before checkout. All compilation and linking then happens against
      # Debian 10's ARM64 GLIBC 2.28 userland.
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            unzip \
            git \
            jq \
            xz-utils \
            build-essential \
            pkg-config \
            file \
            binutils \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
              --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify build baseline
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      # 先组装运行时并把随包 node 放进 PATH：不这样做的话 Pi 的进程 / 锁 / 交付
      # 测试会因为找不到 node 全部提前 return，Linux 作业只是「假绿」。
      - name: Stage Pi runtime
        run: bash ./scripts/stage-pi-runtime.sh --platform linux-arm64 --force

      - name: Put bundled Node on PATH
        run: echo "$PWD/runtime/pi/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Download bundled fonts for layout tests
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl --fail --location --retry 10 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/runtime.zip" \
            -o /tmp/runtime.zip
          unzip -qo /tmp/runtime.zip -d runtime

      # 串行跑测试：vault 的 DEK 句柄与配置目录是进程级状态，Pi 运行记录、加密资源
      # 与单实例等用例并行时会互相污染（Windows / macOS runner 上出现过「尚未解锁」
      # 与 Broken pipe 的伪失败）。整套用例本地串行约 1 分钟，换确定性更值得。
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1

      # 端到端校验随包 runtime/pi 的 manifest（默认被 ignored，只在组装过运行时后跑）。
      - name: Pi runtime manifest end-to-end
        run: |
          set -euo pipefail
          export GONGWEN_PI_RUNTIME_DIR="$PWD/runtime/pi"
          cargo test --locked shipped_pi_runtime_manifest -- --ignored

  # 按发布方式（Debian buster / GLIBC 2.28 容器 + release profile）构建 Linux
  # ARM64 二进制（发布只出这一个 Linux 架构），交给下面的 ubuntu-2004-launch
  # 在干净的 Ubuntu 20.04 里装包并真正启动。
  linux-glibc228-release:
    name: Build release binary (Linux ARM64 / GLIBC 2.28)
    # 停用：当前只做 Windows x64。恢复时删掉这一行。
    if: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: debian:buster
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-arm64-binary
          path: target/release/gongwen-assistant
          if-no-files-found: error
          retention-days: 3

  # Ubuntu 20.04 是麒麟 V10 的底子，也是这批用户机器的实际系统。这里不只看
  # deb 能不能装上（release.yml 的 verify-deb 已经做了），而是在干净的 20.04
  # 里用真实 runtime 打包、只装 Depends，再在 Xvfb 里真正打开一次窗口：
  # dlopen 的库缺失、GL 上下文建不起来、首帧 panic 这类"一打开就闪退"的问题，
  # ldd 看不出来，只有真起窗口才会暴露。
  ubuntu-2004-launch:
    name: Launch smoke test (Ubuntu 20.04 / ARM64)
    needs: linux-glibc228-release
    # 停用：当前只做 Windows x64。恢复时删掉这一行（并先恢复它 needs 的作业）。
    if: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: ubuntu:20.04
    env:
      # 与 release.yml 的 RUNTIME_RELEASE_TAG 保持一致。
      RUNTIME_RELEASE_TAG: v0.8.2
      RUNTIME_REPO: billowsand/gongwen-runtime
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip jq xz-utils binutils libstdc++6 iproute2

      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ci-linux-arm64-binary
          path: dist/staging

      - name: Assemble staging directory with runtime
        run: |
          set -euo pipefail
          staging=dist/staging
          chmod 755 "$staging/gongwen-assistant"
          asset="runtime.zip"
          # Ubuntu 20.04 的软件源里没有 gh（21.04 起才收录），这里只能走 curl。
          # GitHub 的 Release CDN 偶发 504，按 --retry 的退避只重试 4 次不够
          # （2026-11-08 的 CI 就连续 4 次 504 失败）；放宽到 10 次、覆盖 5xx。
          curl --fail --location --retry 10 --retry-delay 5 \
            --connect-timeout 30 \
            "https://github.com/${RUNTIME_REPO}/releases/download/${RUNTIME_RELEASE_TAG}/${asset}" \
            --output "/tmp/${asset}"
          unzip -qo "/tmp/${asset}" -d "$staging/runtime" || {
            status=$?
            test "$status" -eq 1
          }
          # 与 package-portable.ps1 一致：PDF 由 Typst 在进程内排版，runtime 包里
          # 旧有的 tectonic/、texbundle/ 不随包。
          rm -rf "$staging/runtime/tectonic" "$staging/runtime/texbundle"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$staging/"

      - name: Stage bundled Pi runtime
        run: |
          set -euo pipefail
          bash ./scripts/stage-pi-runtime.sh --platform linux-arm64 --force
          cp -a runtime/pi "$GITHUB_WORKSPACE/dist/staging/runtime/pi"

      - name: Offline Pi runtime acceptance
        run: |
          set -euo pipefail
          ./runtime/pi/bin/node scripts/pi-offline-acceptance.mjs --runtime ./runtime/pi

      - name: Package deb
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          bash ./scripts/package-deb.sh "$version" dist/staging dist arm64

      # 先只装 deb 的 Depends，确认依赖声明本身够用；再装 Xvfb 等测试工具。
      - name: Install deb and check shared libraries
        run: bash ./scripts/verify-deb-install.sh dist/gongwen-assistant_*_arm64.deb

      - name: Install virtual display
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            xvfb x11-utils x11-apps imagemagick

      - name: Launch app under Xvfb
        run: bash ./scripts/smoke-launch-linux.sh gongwen-assistant 20 launch-smoke

      - name: Upload launch logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-ubuntu2004-arm64
          path: launch-smoke
          if-no-files-found: ignore
          retention-days: 14

  # 依赖漏洞扫描：RustSec 数据库里登记的已知漏洞。审计结果不影响发布，
  # 但要能看见 —— 依赖升级是唯一能修的漏洞类别。
  dependency-audit:
    name: 依赖漏洞扫描（RustSec）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # audit-check 把结果写成一条检查记录，需要 checks: write；忽略清单见 .cargo/audit.toml。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
