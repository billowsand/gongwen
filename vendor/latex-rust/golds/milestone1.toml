# Gold tests — Milestone 1
# Contract: code must match these values. Do not edit golds to hide a bug.

[[gold]]
name = "tok_frac"
kind = "tokenize"
input = "\\frac{1}{2}"
expect = "cmd:frac { char:1 } { char:2 }"

[[gold]]
name = "tok_super_sub"
kind = "tokenize"
input = "x_i^2"
expect = "char:x _ char:i ^ char:2"

[[gold]]
name = "tok_sqrt_index"
kind = "tokenize"
input = "\\sqrt[n]{x}"
expect = "cmd:sqrt char:[ char:n char:] { char:x }"

[[gold]]
name = "tok_sum_int"
kind = "tokenize"
input = "\\sum_{i=1}^{n}\\int_{a}^{b}"
expect = "cmd:sum _ { char:i char:= char:1 } ^ { char:n } cmd:int _ { char:a } ^ { char:b }"

[[gold]]
name = "tok_greek"
kind = "tokenize"
input = "\\alpha\\beta\\Gamma\\pi"
expect = "cmd:alpha cmd:beta cmd:Gamma cmd:pi"

[[gold]]
