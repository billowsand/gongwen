# Gold tests — Milestone 4 SVG renderer
# Contract: code must match these values. Do not edit golds to hide a bug.
# Structural match: path/rect counts, xmlns, fill. Dimensions are 12 pt em.

[[gold]]
name = "glyph-x"
kind = "svg"
input = "x"
paths = "1"
rects = "0"
contains = "xmlns=\"http://www.w3.org/2000/svg\""
expect = "width=\"6.708pt\""

