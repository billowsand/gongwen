# Gold tests — Milestone 6 accents and decorations
# Contract: code must match these values. Do not edit golds to hide a bug.
# `expect` for kind=dims is MathBox::dim_gold() (STIX Two Math).

[[gold]]
name = "hat-x-ast"
kind = "ast"
input = "\\hat{x}"
expect = "(accent hat (atom Ord \"x\"))"

