# 从字在输入法（青简分支）vendor 而来，见 vendor/qingjian/README.md。
[package]
name = "qingjian-dictionary"
description = "词库：TSV 解析与 .qj mmap 加载，按拼音音节位置二分查询"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/qingjian-team/qingjian"
publish = false

[dependencies]
qingjian-format = { path = "../format" }
thiserror = "2"
tracing = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
