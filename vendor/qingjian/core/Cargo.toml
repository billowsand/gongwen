# 从字在输入法（青简分支）vendor 而来，见 vendor/qingjian/README.md。
[package]
name = "qingjian-core"
description = "拼音输入法核心引擎：拼音解析、候选生成、整句转换、排序与学习接口，平台无关"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/qingjian-team/qingjian"
publish = false

[dependencies]
foldhash = "0.2"
jiff = "0.2"
qingjian-dictionary = { path = "../dictionary" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
