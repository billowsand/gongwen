# cargo audit 的忽略清单：只放「本项目调用不到」的公告，每条写明理由与解除条件。
# CI 的依赖漏洞扫描（.github/workflows/ci.yml 的 dependency-audit）与本机
# `cargo audit` 都读这份文件。

[advisories]
ignore = [
    # zip 8.6：只剩 docx-rs 0.4.22（crates.io 最新）这一条路径，它关掉默认特性、
    # 只开 deflate，只用 ZipWriter 写 DOCX、ZipArchive::by_name 逐条读；不调
    # extract / ZipStreamReader，也没有 aes-crypto / legacy-zip 特性。下面八条
    # （整包解压的软链接与权限越界、AES 截断不校验 HMAC、legacy 解码器按声明
    # 大小预分配、本地头与中央目录名字不一致）在本项目里都不可达。自有的 zip
    # 已升到 9.7，anydoc 与 rust_xlsxwriter 一并跟上；docx-rs 换到 zip 9 后删掉。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    # quick-xml 0.38：只经 hayagriva → citationberg 解析编进程序的 CSL 样式，
    # 用户输入（BibLaTeX 文献库）不走 XML。hayagriva 升级 quick-xml 后删掉。
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
