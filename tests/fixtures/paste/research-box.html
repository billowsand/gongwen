<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>文框样本</title></head>
<body>
<p>研究报告正文里夹着几种文框。</p>

<aside>
  <p><strong>案例1：某市“场景牵引”授权运营做法</strong></p>
  <p>一是先定场景、后给数据。</p>
  <p>二是运营机构分场景准入。</p>
</aside>

<table border="1" cellspacing="0" cellpadding="4">
  <tr>
    <td>
      <p><b>专栏：新加坡的数据治理经验</b></p>
      <p>设立专门机构统筹数据共享，配套出台操作指引。</p>
    </td>
  </tr>
</table>

<div style="border:1px solid #999999;padding:8px">
  <p><b>做法</b></p>
  <p>先把台账建起来，再按季度核对。</p>
</div>

<div style="background-color:#f2f2f2;padding:8px">
  <p><b>延伸阅读：数据要素流通的三条路径</b></p>
  <p>开放共享、授权运营、交易流通。</p>
</div>

<aside>
  <p>这一段的标题没有加粗，不算文框。</p>
  <p>照普通段落排。</p>
</aside>

<table border="1">
  <tr>
    <td>
      <p><b>这是加粗标题</b>后半句不是加粗的。</p>
      <p>单格表格但标题没有整段加粗，照旧拆成段落。</p>
    </td>
  </tr>
</table>
</body>
</html>
